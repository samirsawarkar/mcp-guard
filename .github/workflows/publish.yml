name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c '
          import os, sys, re
          from pathlib import Path

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              sys.exit(f"Tag does not start with v: {tag}")
          tag_version = tag[1:]

          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]", pyproject)
          if not match:
              sys.exit("Version not found in pyproject.toml")
          pyproject_version = match.group(1)

          init_py = Path("mcp_integrity/__init__.py").read_text(encoding="utf-8")
          match_init = re.search(r"(?m)^__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]", init_py)
          if not match_init:
              sys.exit("Version not found in mcp_integrity/__init__.py")
          code_version = match_init.group(1)

          print(f"Tag version:       {tag_version}")
          print(f"pyproject version: {pyproject_version}")
          print(f"code version:      {code_version}")

          if tag_version != pyproject_version:
              sys.exit(f"Tag version ({tag_version}) != pyproject.toml version ({pyproject_version})")
          if tag_version != code_version:
              sys.exit(f"Tag version ({tag_version}) != mcp_integrity.__version__ ({code_version})")
          print("Version verification passed.")
          '

      - name: Run unit tests
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check wheel contents
        run: |
          python -c '
          import sys, zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("No wheel file found in dist/")
          wheel = wheels[0]
          print(f"Checking wheel: {wheel}")

          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              for name in names:
                  print(f"  {name}")
                  if not (name.startswith("mcp_integrity/") or ".dist-info/" in name):
                      sys.exit(f"Unexpected file in wheel: {name}")
                  for forbidden in ("tests/", "bench/", ".aes/"):
                      if forbidden in name:
                          sys.exit(f"Forbidden directory in wheel: {name}")
          print("Wheel content check passed.")
          '

      - name: Install wheel in fresh venv and run e2e test
        run: |
          python -m venv test_venv
          test_venv/bin/pip install dist/*.whl
          MCP_INTEGRITY_BIN="$PWD/test_venv/bin/mcp-integrity" pytest -q tests/test_e2e_installed.py -v

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
