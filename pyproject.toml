[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-integrity"
version = "0.1.0"
description = "A local integrity monitor for stdio MCP servers"
readme = "README.md"
authors = [
    { name = "Samir Sawarkar" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "security", "tool-poisoning", "prompt-injection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/samirsawarkar/mcp-guard"
Repository = "https://github.com/samirsawarkar/mcp-guard"
Issues = "https://github.com/samirsawarkar/mcp-guard/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
]

[project.scripts]
mcp-integrity = "mcp_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_integrity*"]
exclude = ["tests*", ".aes*"]
